name: Build & Release Executables (.exe, .deb, .rpm)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Etiqueta de la Release (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Portable (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Build Windows Executable
        run: uv run python build_executable.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zernike-gui-windows
          path: dist/zernike-gui.exe

  build-linux:
    name: Build Linux Binary, .deb & .rpm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Packaging Tools (fpm & rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby ruby-dev rubygems build-essential rpm alien
          sudo gem install --no-document fpm

      - name: Sync dependencies
        run: uv sync --all-groups

      - name: Build Standalone Linux Executable
        run: uv run python build_executable.py

      - name: Generate .deb and .rpm Packages (With 3D Icon & Safe Packaging)
        run: uv run python build_packages.py

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zernike-gui-linux
          path: |
            dist/zernike-gui
            dist/*.deb
            dist/*.rpm

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: zernike-gui-windows
          path: dist

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: zernike-gui-linux
          path: dist

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum zernike-gui zernike-gui.exe *.deb *.rpm > SHA256SUMS.txt
          echo "--- Sumas de verificación SHA-256 ---"
          cat SHA256SUMS.txt

      - name: Check if Prerelease
        id: check_prerelease
        run: |
          TAG="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$TAG" =~ -(rc|beta|alpha|dev) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Identificada versión preliminar (Prerelease): $TAG"
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "Identificada versión estable (Release): $TAG"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0') }}
          name: Zernike GUI Release ${{ inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0') }}
          body: |
            ## Paquetes Binarios Precompilados (Zernike GUI)
            
            Descarga e instala el paquete correspondiente a tu sistema operativo:
            
            ### Windows 10 / 11
            Descarga **`zernike-gui.exe`** y ejecútalo directamente (ejecutable portátil de 64 bits, no requiere instalación).
            
            ### Debian / Ubuntu / Linux Mint (`.deb`)
            ```bash
            sudo dpkg -i zernike-gui_1.0.0_amd64.deb
            ```
            
            ### Fedora / RHEL / CentOS / AlmaLinux (`.rpm`)
            ```bash
            sudo dnf install ./zernike-gui-1.0.0-1.x86_64.rpm
            ```
            
            ### Linux Binario Genérico (Cualquier distribución Linux)
            ```bash
            chmod +x zernike-gui
            ./zernike-gui
            ```
            
            ---
            ### Verificación de Integridad (SHA-256)
            Puedes verificar las sumas de verificación de cualquier archivo descargado ejecutando:
            ```bash
            sha256sum -c SHA256SUMS.txt
            ```
          generate_release_notes: true
          files: |
            dist/zernike-gui.exe
            dist/zernike-gui
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS.txt
          overwrite: true
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

