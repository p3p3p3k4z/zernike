name: Build and Publish Releases (Linux & Windows)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Executables & Packages on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Packaging Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg alien rpm

      - name: Install Dependencies with uv
        run: |
          uv sync --all-groups

      - name: Build Standalone Executable
        run: |
          uv run python build_executable.py

      - name: Build Linux Packages (.deb & .rpm)
        if: runner.os == 'Linux'
        run: |
          uv run python build_packages.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.platform }}
          path: |
            dist/zernike-gui
            dist/zernike-gui.exe
            dist/*.deb
            dist/*.rpm
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Organize Release Files
        run: |
          mkdir -p release_files
          find release-artifacts -type f \( -name "zernike-gui" -o -name "zernike-gui.exe" -o -name "*.deb" -o -name "*.rpm" \) -exec cp {} release_files/ \;
          ls -la release_files/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: Zernike GUI Release ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          body: |
            ## Paquetes Binarios Precompilados (Zernike GUI)
            
            Descarga directamente el ejecutable o instalador correspondiente a tu sistema operativo:
            
            - **Windows 10/11**: `zernike-gui.exe` (Ejecutable portátil de 64 bits)
            - **Debian / Ubuntu / Linux Mint**: `zernike-gui_1.0.0_amd64.deb` (`sudo dpkg -i ...`)
            - **Fedora / RHEL / CentOS**: `zernike-gui-1.0.0-1.x86_64.rpm` (`sudo dnf install ...`)
            - **Linux (Binario Genérico ELF)**: `zernike-gui`
          draft: false
          prerelease: false
          files: release_files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
